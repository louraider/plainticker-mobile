<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
<!--
  PlainTicker, mark 04: The kept place
  Says: three registered places, two of them filled, the third kept and left blank
  Nearest system glyph: a bar chart with a missing bar, and the battery glyph
  Not that glyph because: bars vary in height to carry a quantity and these are two identical blocks over three identical registers, so they are places rather than values; the third register is drawn and empty, which is a reserved slot and not a missing bar. A battery has one container, not three, and no chart draws the register of a value it does not have.
  The refusal: drawn directly. The third place is not closed up and not removed, which is the difference between disclosure and curation, and the accent is on the empty place rather than on the filled ones.
  Breaks: Section 2 lists what may carry the Accent and a blank is not on the list. Declared rather than smuggled: a launcher tile carries exactly one accent, the subject of this mark is the place that was not filled, so the accent is on that place. Section 8's ban on three equal tiles is about layout containers and these are glyph places on a rule, but the resemblance is close enough to write down.
  Layer: flattened to one colour, themed icon and notification
  Thinnest positive shape 10 units, 8.4dp and 25 device pixels on the
  Seeker's measured 60.7dp drawer tile. Ink share of the visible 72: 27.1%.
  Mark box 57 x 44 units at (25, 32) in the 108 adaptive viewport.
  Furthest corner 36.40 of the 33 circle-mask guarantee; drawn against the
  superellipse measured off the phone, see attempt-three/composite.py.
  Generated by design/brand/logo/marks_logo.py, do not edit by hand.
-->
