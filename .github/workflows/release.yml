name: Release

# Tag v<major>.<minor>.<patch>[-suffix] -> signed release APK attached to a GitHub Release.
#   versionName = tag without the leading v      (v0.2.0 -> 0.2.0)
#   versionCode = major*10000 + minor*100 + patch (v0.2.0 -> 200); a -suffix marks a pre-release,
#   except -amber, which names the shipped design line and is a normal release marked Latest.
# The APK is attached twice: plainticker-<versionName>.apk, and plainticker.apk, the stable name
# behind https://github.com/louraider/plainticker-mobile/releases/latest/download/plainticker.apk.
# Signing material comes only from secrets (docs/release-signing.md):
#   KEYSTORE_BASE64  KEYSTORE_PASSWORD  KEY_ALIAS  KEY_PASSWORD
# The job runs in the `release` environment, so those secrets can live in that protected
# environment behind a required reviewer; a job in an environment still reads repository-level
# secrets, so the workflow keeps working while they are repo-level too.
# A tag only builds when its commit is already on main: a tag pushed on a side branch or an
# unmerged commit is refused before any secret is read.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Whole history, so the ancestry check below never meets a shallow boundary.
          fetch-depth: 0

      - name: Refuse a tag whose commit is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not reachable from origin/main; merge it to main before tagging"
            exit 1
          fi
          echo "tagged commit is on main"

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>[-suffix]"; exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}; suffix=${BASH_REMATCH[4]:-}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be < 100 to keep versionCode monotonic"; exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "name=${TAG#v}"
            echo "code=$code"
            # -amber is the design line every shipped build carries, not a release candidate.
            echo "prerelease=$([[ -n "$suffix" && "$suffix" != "-amber" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "versionName=${TAG#v} versionCode=$code suffix=${suffix:-none}"

      - name: Check signing secrets are present
        env:
          HAS_KS: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_PW: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAS_KPW: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for v in HAS_KS HAS_PW HAS_ALIAS HAS_KPW; do
            if [ "${!v}" != "true" ]; then
              echo "::error::missing repository secret for $v (see docs/release-signing.md)"; exit 1
            fi
          done

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Decode keystore to a temp path
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PversionCode="$VERSION_CODE"
          -PversionName="$VERSION_NAME"

      - name: Verify the APK is signed and print the certificate digest
        env:
          # Already validated by the version step; passed through env anyway so no github.*
          # value is ever spliced into shell text.
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK not found - release stayed unsigned?"; ls -la app/build/outputs/apk/release/ || true; exit 1
          fi
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          digest=$(grep -m1 'SHA-256 digest' /tmp/certs.txt | awk '{print $NF}')
          colon=$(printf %s "$digest" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          {
            echo "## Release $TAG"
            echo
            echo "- versionName \`$VERSION_NAME\`, versionCode \`$VERSION_CODE\`"
            echo "- signing certificate SHA-256 (for \`/.well-known/assetlinks.json\`): \`$colon\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Name the release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/plainticker-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/plainticker.apk
          ls -la dist

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/plainticker-${{ steps.version.outputs.name }}.apk
            dist/plainticker.apk
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          # A normal release becomes Latest, so /releases/latest/download/plainticker.apk follows it.
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
