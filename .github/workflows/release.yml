name: Release

# Tag v<major>.<minor>.<patch>[-suffix] -> signed release APK attached to a GitHub Release.
#   versionName = tag without the leading v      (v0.2.0 -> 0.2.0)
#   versionCode = major*10000 + minor*100 + patch (v0.2.0 -> 200); a -suffix marks a pre-release.
# Signing material comes only from repository secrets (docs/release-signing.md):
#   KEYSTORE_BASE64  KEYSTORE_PASSWORD  KEY_ALIAS  KEY_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>[-suffix]"; exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}; suffix=${BASH_REMATCH[4]:-}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be < 100 to keep versionCode monotonic"; exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "name=${TAG#v}"
            echo "code=$code"
            echo "prerelease=$([[ -n "$suffix" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "versionName=${TAG#v} versionCode=$code prerelease=${suffix:+yes}"

      - name: Check signing secrets are present
        env:
          HAS_KS: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_PW: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAS_KPW: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for v in HAS_KS HAS_PW HAS_ALIAS HAS_KPW; do
            if [ "${!v}" != "true" ]; then
              echo "::error::missing repository secret for $v (see docs/release-signing.md)"; exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode keystore to a temp path
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PversionCode="$VERSION_CODE"
          -PversionName="$VERSION_NAME"

      - name: Verify the APK is signed and print the certificate digest
        env:
          # Already validated by the version step; passed through env anyway so no github.*
          # value is ever spliced into shell text.
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK not found - release stayed unsigned?"; ls -la app/build/outputs/apk/release/ || true; exit 1
          fi
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          digest=$(grep -m1 'SHA-256 digest' /tmp/certs.txt | awk '{print $NF}')
          colon=$(printf %s "$digest" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          {
            echo "## Release $TAG"
            echo
            echo "- versionName \`$VERSION_NAME\`, versionCode \`$VERSION_CODE\`"
            echo "- signing certificate SHA-256 (for \`/.well-known/assetlinks.json\`): \`$colon\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
