name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the daemon toolchain to 21 (compile target stays
      # Java 17 via compileOptions). Installing 21 here means Gradle does not have to download a
      # second JDK through the foojay resolver on every run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No runner has a phone, so nothing here walks the app. This job proves only that the
      # scripts parse and pass shellcheck, and that device-smoke's own entry point works on a
      # machine with no adb. The walk itself is run by a person on the Seeker before the release
      # APK is cut and before the video is recorded, and the result is written into
      # docs/qa-checklist.md.
      - name: Parse
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck scripts/*.sh

      - name: device-smoke usage
        run: bash scripts/device-smoke.sh --help

      # coverage-health reaches five live upstreams, so a runner cannot run it for real without
      # being flaky and burning a keyless rate limit on every push. What CI can prove is that its
      # judgement is right, which is the half that decides whether a demo gets recorded: the
      # rules are a pure function and --self-test walks nine cases including the two that must
      # fail. A person runs the live half on day one, the morning of the video and the morning of
      # the submission, and writes the result into docs/qa-checklist.md.
      - name: coverage-health scripts parse
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: coverage-health judgement
        run: node scripts/coverage-health.mjs --self-test

  redaction-guard:
    name: Redaction guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --history needs every commit

      - name: Working tree
        run: bash scripts/redaction-guard.sh

      - name: History
        run: bash scripts/redaction-guard.sh --history
